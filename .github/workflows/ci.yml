name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -timeout 900s ./...
      - name: go test (race)
        run: go test -race -count=1 -timeout 1200s ./...

  docker-check:
    needs: go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: conductor:smoke
          platforms: linux/amd64
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=conductor-build
          cache-to: type=gha,mode=max,scope=conductor-build
      - name: Container smoke test
        run: sh scripts/smoke-container.sh conductor:smoke

      - name: Verify linux/arm64 build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/arm64
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=conductor-build-arm64
          cache-to: type=gha,mode=max,scope=conductor-build-arm64

      - uses: docker/login-action@v3
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
        id: meta
        env:
          IMAGE: ghcr.io/mrchypark/conductor
          COMMIT: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tags="$IMAGE:$COMMIT"
          if [[ "$REF_TYPE" == "tag" ]]; then
            tags="$tags,$IMAGE:$REF_NAME"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Publish multi-arch image
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: |
            type=gha,scope=conductor-build
            type=gha,scope=conductor-build-arm64
      - name: Summarize published image
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
        run: |
          echo "Published multi-arch image (linux/amd64,linux/arm64): ghcr.io/mrchypark/conductor@${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
