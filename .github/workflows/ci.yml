name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -timeout 900s ./...
      - name: go test (race)
        run: go test -race -count=1 -timeout 1200s ./...

  docker-check:
    needs: go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: conductor:smoke
          platforms: linux/amd64
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=conductor-build
          cache-to: type=gha,mode=max,scope=conductor-build
      - name: Container smoke test
        run: sh scripts/smoke-container.sh conductor:smoke

      - uses: docker/login-action@v3
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/mrchypark/conductor
          COMMIT: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker tag conductor:smoke "$IMAGE:$COMMIT"
          output=$(docker push "$IMAGE:$COMMIT")
          echo "$output"
          [[ $output =~ digest:\ (sha256:[0-9a-f]{64}) ]] || exit 1
          digest=${BASH_REMATCH[1]}
          if [[ "$REF_TYPE" == "tag" ]]; then
            docker tag conductor:smoke "$IMAGE:$REF_NAME"
            output=$(docker push "$IMAGE:$REF_NAME")
            echo "$output"
            [[ $output =~ digest:\ (sha256:[0-9a-f]{64}) ]] || exit 1
            [[ ${BASH_REMATCH[1]} == "$digest" ]] || exit 1
          fi
          echo "Published image: $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
